# On AWS: every container logs to CloudWatch (/lane/<service>, 30 days; the groups are in
# cloudformation.yml). Docker's daemon sends them with the instance role.
#   docker compose -f docker-compose.yml -f docker-compose.aws.yml up -d

x-cloudwatch: &cloudwatch
  driver: awslogs
  options: &cloudwatch-options
    awslogs-region: us-east-1
    mode: non-blocking
    max-buffer-size: 4m

services:
  caddy:
    logging: { <<: *cloudwatch, options: { <<: *cloudwatch-options, awslogs-group: /lane/caddy } }
  web:
    logging: { <<: *cloudwatch, options: { <<: *cloudwatch-options, awslogs-group: /lane/web } }
  api:
    logging: { <<: *cloudwatch, options: { <<: *cloudwatch-options, awslogs-group: /lane/api } }
  worker:
    logging: { <<: *cloudwatch, options: { <<: *cloudwatch-options, awslogs-group: /lane/worker } }
  migrate:
    logging: { <<: *cloudwatch, options: { <<: *cloudwatch-options, awslogs-group: /lane/api } }
  mailpit:
    logging: { <<: *cloudwatch, options: { <<: *cloudwatch-options, awslogs-group: /lane/mailpit } }
