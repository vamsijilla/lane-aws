# Gold set for the sample submission (Cobalt Mesa Transport). Built by hand from the source
# documents (verified against the PDFs, sheets and scans), not from
# pipeline output. Packet specifics live only here and in data/.
#
# Matching conventions (lane/evals/score.py):
#   entity: kind plus a key or label substring.   values: any listed value counts as correct.
#   conflicts/missing: matched by field label or missing-item code prefix; `or_missing` /
#   `or_rule` accept the same fact surfaced another way.

