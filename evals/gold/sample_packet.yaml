  - {id: F13, topic: Telematics data request, all: [[telematics, ELD, safety score]]}
  - {id: F14, topic: Unsigned application, all: [[sign]]}
  - {id: F16, topic: Volkov downgrade, all: [[Volkov], [downgrade, clearance, medical]]}
