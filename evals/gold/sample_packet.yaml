# Updated with the review of Nov 1, 2026: C06 (UM limit) is a low conflict; agency
# name and phones are one "Agency identity" card (phones are multi-valued); the ownership change
# is a note on the legal entity card, not a conflict; C14 is a rule outcome (COV-02).
conflicts:
  - {id: C01, label: Legal entity form}
  - {id: C02, label: Agency identity}
  - {id: C03, label: Power units}
  - {id: C04, label: Owner drives}
  - {id: C05, label: Refrigerated}
  - {id: C06, label: Uninsured motorist limit}
  - {id: C07, label: Farthest territory}
  - {id: C08, label: "Make: 2020 Volvo"}
  - {id: C09, label: "Date of birth: Luis Morales"}
  - {id: C10, label: "Carrier: Cargo 2023"}
  - {id: C11, label: vehicles not listed on the application, or_missing: VEH_UNLISTED}
  # Added Nov 1, 2026 (evals/GOLD_CHANGES.md): real disagreements in the files
  - {id: C13, label: Years of prior insurance}
  - {id: C14, label: Physical damage carried before}
# Real disagreements found beyond the list above; they count as correct, not as false alarms.
conflicts_also_valid: []

