# An expert's findings, with later additions. A finding covers a topic when its title or
# body contains at least one word from every group.
findings:
  - {id: F01, topic: Open BI claim with large reserve, all: [[open, reserve], ["52,500", "52500", bodily, BI]]}
  - {id: F02, topic: Late claim reporting, all: [[late, days, weeks, delay], [report]]}
  - {id: F03, topic: Unscheduled driver and truck in a claim, all: [[Brandt, unscheduled, unlisted, not on the schedule, not scheduled]]}
  - {id: F04, topic: Peterbilt may be the fifth unit, all: [[Peterbilt], [fifth, "5th", "5 units", five, unit count, power unit]]}
  - {id: F05, topic: High claim frequency, all: [[frequency, two claims, 2 claims]]}
  - {id: F06, topic: Long-haul profile vs farthest territory, all: [[miles, mileage], [long-haul, long haul, outside California, territory, Texas, TX]]}
  - {id: F07, topic: Late IFTA filing penalty, all: [[penalty, interest], [IFTA, Q1, quarter]]}
  - {id: F08, topic: Q2 mileage drop, all: [[drop, decline, fell, down, lower], [Q2, second quarter, mileage, miles]]}
  - {id: F09, topic: No workers comp, all: [[workers, comp]]}
  - {id: F10, topic: Cargo value above cargo limit, all: [["125,000", "125000", load value, cargo value], [limit, underinsur]]}
