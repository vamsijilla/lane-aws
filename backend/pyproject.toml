[project]
name = "lane"
version = "0.1.0"
description = "Lane: AI submission intake and review for commercial auto underwriting"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "structlog>=26.1",
    "openpyxl>=3.1.5,<4",
    "pillow>=13.0.0",
    "numpy>=2.5.4",
    "pymupdf>=1.28.2,<1.29",
    "anthropic>=2.3,<3",
    "rapidfuzz>=3.14,<4",
    "rapidocr>=3.10,<4",
    "onnxruntime>=1.31,<2",
    "pyyaml>=6",
    "psycopg[binary]>=3.2",
    "boto3>=1.40",
    "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    "hypothesis>=6.170",
    "httpx2>=2.16",
    "ruff>=0.17",
    "pyright>=1.1.414",
    "types-pyyaml>=6.0.12.20261030",
    "moto[s3]>=5.1",
    "boto3-stubs[s3]>=1.43.123",
    "botocore-stubs>=1.43.123",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lane"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "TID"]
ignore = ["S101", "E501"]  # line length is the formatter's job

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"migrations/**" = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # PyMuPDF's SWIG bindings warn while loading; as an error this crashes the native import.
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
